name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx
      
      - name: Run backend e2e tests
        run: |
          pytest tests/backend/test_e2e_api.py -v -m "e2e or api_e2e"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-results
          path: |
            backend/.pytest_cache/
            backend/htmlcov/

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium
      
      - name: Run frontend e2e tests
        run: |
          cd frontend
          npm run test:e2e
        env:
          CI: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-results
          path: |
            frontend/test-results/
            frontend/playwright-report/

  full-stack-e2e:
    name: Full Stack E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-e2e, frontend-e2e]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      
      - name: Start backend server
        run: |
          cd backend
          python -m uvicorn app.main:app --port 8000 &
          sleep 5
        env:
          LOG_LEVEL: INFO
      
      - name: Start frontend server
        run: |
          cd frontend
          npm run dev &
          sleep 10
      
      - name: Run full stack e2e tests
        run: |
          cd frontend
          npm run test:e2e -- tests/e2e/full-workflow.spec.ts
        env:
          CI: true
          FRONTEND_URL: http://localhost:5173
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-e2e-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
