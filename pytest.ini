[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
markers =
    e2e: End-to-end tests
    api_e2e: API end-to-end tests
    frontend_e2e: Frontend end-to-end tests
    full_stack: Full stack end-to-end tests
